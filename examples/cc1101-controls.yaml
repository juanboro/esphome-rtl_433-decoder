sensor:
  - platform: template
    id: ${cc1101id}_sensor_rssi
    name: "${cc1101name} RSSI"
    lambda: |-
      float rssi;
      int8_t rawRSSI=id(${cc1101id}_state).RSSI;
      rssi = (((float)rawRSSI)/2.0f) - 74.0f;
      return rssi;
    update_interval: 11s
    unit_of_measurement: dB

  - platform: template
    id: ${cc1101id}_sensor_rx_rssi
    name: "${cc1101name} Last RX RSSI"
    lambda: |-
      float rssi;
      int8_t rawRSSI=id(${cc1101id}_state).RSSI;
      rssi = (((float)rawRSSI)/2.0f) - 74.0f;
      return rssi;
    update_interval: never
    unit_of_measurement: dB

