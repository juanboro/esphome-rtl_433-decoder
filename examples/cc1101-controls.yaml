
globals:
  - id: ${cc1101id}_state
    type: esphome::cc1101::CC1101State
    restore_value: no
    
esphome:
  on_boot:
    - priority: 801.0
      then:
        - lambda: |-
            // If ESP 32 remote is enabled - then we should safely be able to ISR monitor the gdo0 pin...
            #ifdef USE_ESP32
            #include <soc/soc_caps.h>
            #if SOC_RMT_SUPPORTED
            id(rxsensor)->set_use_interrupt(true);
            #endif
            #endif
    - priority: -101.0
      then:
        - remote_transmitter.digital_write:
            # make sure that we are not pulling down
            transmitter_id: ${cc1101id}_rf_transmitter
            value: true

binary_sensor:
  - platform: gpio
    id: rxsensor
    pin:
      number: $rx
      allow_other_uses: true
      mode:
        input: true
        output: true
        pullup: true
        open_drain: true
    filters:
      settle: 150ms
    on_press:
      - lambda: |-
          if (!${cc1101id}->is_ready()) {
            id(read_${cc1101id}_registers)->execute(static_cast<int>(esphome::cc1101::Register::RSSI),static_cast<int>(esphome::cc1101::Register::RSSI));
            id(${cc1101id}_sensor_rx_rssi)->update();
          }

script:
  - id: read_${cc1101id}_registers
    parameters:
      begin_register: int
      end_register: int

    then:
      lambda: |-
        if ((!${cc1101id}->is_ready())||(begin_register > end_register)) {
          return;
        }

        int count = end_register - begin_register + 1;
        if (count <= 0) {
          return;
        }

        id(${cc1101id}).enable();
        id(${cc1101id}).write_byte(begin_register | static_cast<uint8_t>(esphome::cc1101::BUS_READ | esphome::cc1101::BUS_BURST));
        id(${cc1101id}).read_array(&id(${cc1101id}_state).regs()[begin_register], count);
        id(${cc1101id}).disable();
  - id: read_all_${cc1101id}_registers
    then:
      script.execute:
        id: read_${cc1101id}_registers
        begin_register: 0
        end_register: 63
  - id: write_${cc1101id}_register
    parameters:
      write_register: int
      value: int

    then:
      lambda: |-
        if ((!${cc1101id}->is_ready())||(value<0)||(value>255)) {
          return;
        }

        id(${cc1101id}).enable();
        id(${cc1101id}).write_byte(write_register | static_cast<uint8_t>(esphome::cc1101::BUS_WRITE | esphome::cc1101::BUS_BURST));
        id(${cc1101id}).write_byte(static_cast<uint8_t>(value));
        id(${cc1101id}).disable();

  - id: set_${cc1101id}_freq_offset
    parameters:
      offset: float
    then:
      - script.execute:
          id: write_${cc1101id}_register
          write_register: !lambda return static_cast<int>(esphome::cc1101::Register::FSCTRL0);
          value: !lambda return static_cast<uint8_t>(static_cast<int>((offset)/(esphome::cc1101::XTAL_FREQUENCY/(1<<14))));

interval:
  - interval: 10s
    then:
      - script.execute: read_all_${cc1101id}_registers

number:
  - platform: template
    id: ${cc1101id}_freq_num
    name: "${cc1101name} frequency"
    lambda: |-
      uint32_t FREQ=id(${cc1101id}_state).FREQ2 << 16;
      FREQ|=id(${cc1101id}_state).FREQ1 << 8;
      FREQ|=id(${cc1101id}_state).FREQ0;
      // probably should also include the channel number offset in here
      return roundf(1e-4*(static_cast<float>(FREQ) * esphome::cc1101::XTAL_FREQUENCY)/(1<<16))/100;
    set_action: 
      then:
        - cc1101.set_frequency: 
           id: ${cc1101id}
           value: !lambda return x*1e6;
        - cc1101.set_channel:
            id: ${cc1101id}
            value: 0
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_freq_num).update();

    min_value: 300.0
    max_value: 928.0
    step: 0.01
    update_interval: 11s
    unit_of_measurement: MHz

  - platform: template
    id: ${cc1101id}_br_num
    name: "${cc1101name} bitrate"
    lambda: |-      
      uint8_t drate_m = id(${cc1101id}_state).MDMCFG3;
      uint8_t drate_e = id(${cc1101id}_state).MDMCFG4 & 0x0f;

      float rate = ( (256.0f + drate_m) * (1u << drate_e) * esphome::cc1101::XTAL_FREQUENCY ) / (1u << 28);
      rate/=1000;
      return std::round(rate / 0.025) * 0.025;

    set_action: 
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_symbol_rate(x*1000);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_br_num).update();
    min_value: 0.025
    max_value: 600
    step: 0.025
    unit_of_measurement: kbps

  - platform: template
    id: ${cc1101id}_bw_num
    name: "${cc1101name} filter bandwidth"
    lambda: |-
        // Extract the configuration fields from the register
        // Bits 5:4 are CHANBW_M (Row selector in Table 26)
        // Bits 7:6 are CHANBW_E (Column selector in Table 26)
        uint8_t chanbw_m = (id(${cc1101id}_state).MDMCFG4 >> 4) & 0x03;
        uint8_t chanbw_e = (id(${cc1101id}_state).MDMCFG4 >> 6) & 0x03;

        uint8_t table_index = (chanbw_m * 4) + chanbw_e;

        static const float bandwidths_26MHz[] = {
          812.0f, 406.0f, 203.0f, 102.0f,
          650.0f, 325.0f, 162.0f, 81.0f,
          541.0f, 270.0f, 135.0f, 68.0f,
          464.0f, 232.0f, 116.0f, 58.0f
        };
    
        return bandwidths_26MHz[table_index] * (esphome::cc1101::XTAL_FREQUENCY / 26.0e6f);
    set_action: 
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_filter_bandwidth(x*1000);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_bw_num).update();
    min_value: 58.0
    max_value: 818.0
    step: 10
    unit_of_measurement: kHz

  - platform: template
    id: ${cc1101id}_fsk_deviation
    name: "${cc1101name} FSK deviation"
    lambda: |-      
      float deviation = ( (8.0f + id(${cc1101id}_state).DEVIATION_M) * (1u << id(${cc1101id}_state).DEVIATION_E) * esphome::cc1101::XTAL_FREQUENCY ) / (1u << 17);
      deviation/=1000;
      return std::round(deviation / 0.025) * 0.025;

    set_action: 
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_fsk_deviation(x*1000);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_fsk_deviation).update();
    min_value: 1.5
    max_value: 381
    step: 0.025
    unit_of_measurement: kHz

  - platform: template
    id: ${cc1101id}_msk_deviation
    name: "${cc1101name} MSK deviation"
    lambda: return id(${cc1101id}_state).DEVIATION_M-1;
    set_action: 
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_msk_deviation(x);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_msk_deviation).update();
    min_value: 1
    max_value: 8
    step: 1

  - platform: template
    id: ${cc1101id}_channel
    name: "${cc1101name} channel"
    lambda: return id(${cc1101id}_state).CHANNR;
    set_action: 
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_channel(x);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_channel).update();
    min_value: 0
    max_value: 255
    step: 1

  - platform: template
    id: ${cc1101id}_channel_spacing
    name: "${cc1101name} Channel spacing"
    lambda: |-      
      float space = ( (256.0f + id(${cc1101id}_state).CHANSPC_M) * (1u << id(${cc1101id}_state).CHANSPC_E) * esphome::cc1101::XTAL_FREQUENCY ) / (1u << 18);
      space/=1000;
      return std::round(space / 0.025) * 0.025;
    set_action: 
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_channel_spacing(x*1000);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_channel_spacing).update();
    min_value: 25
    max_value: 405
    step: 0.025
    unit_of_measurement: kHz

  - platform: template
    id: ${cc1101id}_if_frequency
    name: "${cc1101name} IF frequency"
    lambda: |-      
      float iffreq = ( id(${cc1101id}_state).FREQ_IF * esphome::cc1101::XTAL_FREQUENCY ) / (1u << 10);
      iffreq/=1000;
      return std::round(iffreq / 0.025) * 0.025;
    set_action: 
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_if_frequency(x*1000);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_if_frequency).update();
    min_value: 25
    max_value: 788
    step: 0.025
    unit_of_measurement: kHz

  - platform: template
    id: ${cc1101id}_packet_length
    name: "${cc1101name} Packet length"
    lambda: |-
      return id(${cc1101id}_state).LENGTH_CONFIG == static_cast<uint8_t>(esphome::cc1101::LengthConfig::LENGTH_CONFIG_FIXED)
          ? id(${cc1101id}_state).PKTLEN
          : 0;
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_packet_length(x);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_packet_length).update();
    min_value: 0
    max_value: 64
    step: 1

  - platform: template
    id: ${cc1101id}_sync0
    name: "${cc1101name} Sync word low byte"
    lambda: return id(${cc1101id}_state).SYNC0;
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_sync0(x);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_sync0).update();
    min_value: 0
    max_value: 255
    step: 1

  - platform: template
    id: ${cc1101id}_sync1
    name: "${cc1101name} Sync word high byte"
    lambda: return id(${cc1101id}_state).SYNC1;
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_sync1(x);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_sync1).update();
    min_value: 0
    max_value: 255
    step: 1

  - platform: template
    id: ${cc1101id}_num_preamble
    name: "${cc1101name} Preamble length"
    lambda: return static_cast<uint8_t>(id(${cc1101id}_state).NUM_PREAMBLE);
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_num_preamble(x);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_num_preamble).update();
    min_value: 0
    max_value: 7
    step: 1

  - platform: template
    id: ${cc1101id}_carrier_sense_abs_thr
    name: "${cc1101name} Carrier sense absolute threshold"
    lambda: |-
      int8_t thr = static_cast<int8_t>(id(${cc1101id}_state).CARRIER_SENSE_ABS_THR);
      if (thr & 0x08) {
        thr -= 16;
      }
      return thr;
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_carrier_sense_abs_thr(x);
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_carrier_sense_abs_thr).update();
    min_value: -8
    max_value: 7
    step: 1

  - platform: template
    id: ${cc1101id}_freqoff
    name: "${cc1101name} Frequency Synthesizer offset"
    lambda: |-
      int8_t freqoff = static_cast<int8_t>(id(${cc1101id}_state).FSCTRL0);
      return (freqoff * esphome::cc1101::XTAL_FREQUENCY/(1<<14))/1000;
    set_action:
      then:
        - script.execute:
            id: write_${cc1101id}_register
            write_register: !lambda return static_cast<int>(esphome::cc1101::Register::FSCTRL0);
            value: !lambda return static_cast<uint8_t>(static_cast<int>((x*1000)/(esphome::cc1101::XTAL_FREQUENCY/(1<<14))));
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_freqoff).update();
    min_value: -202
    max_value: 202
    step: 1.59
    unit_of_measurement: kHz

select:
  - platform: template
    id: ${cc1101id}_sync_mode
    name: "${cc1101name} Sync mode"
    options:
      - "None"
      - "15/16"
      - "16/16"
      - "30/32"
    lambda: |-
      return id(${cc1101id}_sync_mode).at(id(${cc1101id}_state).SYNC_MODE);
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_sync_mode(static_cast<esphome::cc1101::SyncMode>(id(${cc1101id}_sync_mode).index_of(x).value()));
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_sync_mode).update();

  - platform: template
    id: ${cc1101id}_modulation
    name: "${cc1101name} modulation"
    options:
      - "OOK (default)"
      - "2-FSK"
      - "4-FSK"
      - "GFSK"
      - "MSK"
    lambda: |-
      esphome::cc1101::Modulation m=static_cast<esphome::cc1101::Modulation>(id(${cc1101id}_state).MOD_FORMAT);
      return id(${cc1101id}_modulation).at((m == esphome::cc1101::Modulation::MODULATION_ASK_OOK) ? 0 :
                                           (m == esphome::cc1101::Modulation::MODULATION_2_FSK)   ? 1 :
                                           (m == esphome::cc1101::Modulation::MODULATION_4_FSK)   ? 2 :
                                           (m == esphome::cc1101::Modulation::MODULATION_GFSK)    ? 3 :
                                                                                                    4);

    set_action: 
      then:
          - lambda: |-
              if (${cc1101id}->is_ready()) {
                uint8_t idx=id(${cc1101id}_modulation).index_of(x).value();
                id($cc1101id).set_modulation_type((idx == 0) ? esphome::cc1101::Modulation::MODULATION_ASK_OOK :
                                                  (idx == 1) ? esphome::cc1101::Modulation::MODULATION_2_FSK :
                                                  (idx == 2) ? esphome::cc1101::Modulation::MODULATION_4_FSK :
                                                  (idx == 3) ? esphome::cc1101::Modulation::MODULATION_GFSK :
                                                               esphome::cc1101::Modulation::MODULATION_MSK);
              }
          - script.execute: read_all_${cc1101id}_registers
          - lambda: id(${cc1101id}_modulation).update();
  - platform: template
    id: ${cc1101id}_rx_attenuation
    name: "${cc1101name} RX attenuation"
    options:
      - "0dB (default)"
      - "6dB"
      - "12dB"
      - "18dB"
    lambda: |-
      return id(${cc1101id}_rx_attenuation).at(id(${cc1101id}_state).CLOSE_IN_RX);
    set_action: 
      then:
          - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_rx_attenuation(static_cast<esphome::cc1101::RxAttenuation>(id(${cc1101id}_rx_attenuation).index_of(x).value()));
          - script.execute: read_all_${cc1101id}_registers
          - lambda: id(${cc1101id}_rx_attenuation).update();

  - platform: template
    id: ${cc1101id}_magn_target
    name: "${cc1101name} MAGN target"
    options:
      - "24dB"
      - "27dB"
      - "30dB"
      - "33dB (default)"
      - "36dB"
      - "38dB"
      - "40dB"
      - "42dB"

    lambda: |-
      return id(${cc1101id}_magn_target).at(id(${cc1101id}_state).MAGN_TARGET);
    set_action: 
      then:
          - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_magn_target(static_cast<esphome::cc1101::MagnTarget>(id(${cc1101id}_magn_target).index_of(x).value()));
          - script.execute: read_all_${cc1101id}_registers
          - lambda: id(${cc1101id}_magn_target).update();

  - platform: template
    id: ${cc1101id}_max_lna_gain
    name: "${cc1101name} Max LNA gain"
    options:
      - "Max (default)"
      - "Max-2dB"
      - "Max-6.1dB"
      - "Max-7.4dB"
      - "Max-9.2dB"
      - "Max-11.5dB"
      - "Max-14.6dB"
      - "Max-17.1dB"

    lambda: |-
      return id(${cc1101id}_max_lna_gain).at(id(${cc1101id}_state).MAX_LNA_GAIN);
    set_action: 
      then:
          - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_max_lna_gain(static_cast<esphome::cc1101::MaxLnaGain>(id(${cc1101id}_max_lna_gain).index_of(x).value()));
          - script.execute: read_all_${cc1101id}_registers
          - lambda: id(${cc1101id}_max_lna_gain).update();

  - platform: template
    id: ${cc1101id}_max_dvga_gain
    name: "${cc1101name} Max DVGA gain"
    options:
      - "All gain settings (default)"
      - "Disallow highest gain setting"
      - "Disallow 2 highest gain settings"
      - "Disallow 3 highest gain settings"

    lambda: |-
      return id(${cc1101id}_max_dvga_gain).at(id(${cc1101id}_state).MAX_DVGA_GAIN);
    set_action: 
      then:
          - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_max_dvga_gain(static_cast<esphome::cc1101::MaxDvgaGain>(id(${cc1101id}_max_dvga_gain).index_of(x).value()));
          - script.execute: read_all_${cc1101id}_registers
          - lambda: id(${cc1101id}_max_dvga_gain).update();


  - platform: template
    id: ${cc1101id}_carrier_sense_rel_thr
    name: "${cc1101name} Carrier sense relative threshold"
    options:
      - "Default"
      - "+6dB"
      - "+10dB"
      - "+14dB"
    lambda: |-
      return id(${cc1101id}_carrier_sense_rel_thr).at(id(${cc1101id}_state).CARRIER_SENSE_REL_THR);
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_carrier_sense_rel_thr(static_cast<esphome::cc1101::CarrierSenseRelThr>(id(${cc1101id}_carrier_sense_rel_thr).index_of(x).value()));
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_carrier_sense_rel_thr).update();

  - platform: template
    id: ${cc1101id}_filter_length_fsk_msk
    name: "${cc1101name} Filter length FSK⁄MSK"
    options:
      - "8"
      - "16 (default)"
      - "32"
      - "64"
    lambda: |-
      return id(${cc1101id}_filter_length_fsk_msk).at(id(${cc1101id}_state).FILTER_LENGTH);
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_filter_length_fsk_msk(static_cast<esphome::cc1101::FilterLengthFskMsk>(id(${cc1101id}_filter_length_fsk_msk).index_of(x).value()));
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_filter_length_fsk_msk).update();

  - platform: template
    id: ${cc1101id}_filter_length_ask_ook
    name: "${cc1101name} Filter length ASK⁄OOK"
    options:
      - "4dB"
      - "8dB (default)"
      - "12dB"
      - "16dB"
    lambda: |-
      return id(${cc1101id}_filter_length_ask_ook).at(id(${cc1101id}_state).FILTER_LENGTH);
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_filter_length_ask_ook(static_cast<esphome::cc1101::FilterLengthAskOok>(id(${cc1101id}_filter_length_ask_ook).index_of(x).value()));
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_filter_length_ask_ook).update();

  - platform: template
    id: ${cc1101id}_freeze
    name: "${cc1101name} AGC freeze"
    options:
      - "Default"
      - "On Sync"
      - "Analog Only"
      - "Analog And Digital"
    lambda: |-
      return id(${cc1101id}_freeze).at(id(${cc1101id}_state).AGC_FREEZE);
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_freeze(static_cast<esphome::cc1101::Freeze>(id(${cc1101id}_freeze).index_of(x).value()));
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_freeze).update();

  - platform: template
    id: ${cc1101id}_wait_time
    name: "${cc1101name} AGC wait time"
    options:
      - "8"
      - "16"
      - "24"
      - "32"
    lambda: |-
      return id(${cc1101id}_wait_time).at(id(${cc1101id}_state).WAIT_TIME);
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_wait_time(static_cast<esphome::cc1101::WaitTime>(id(${cc1101id}_wait_time).index_of(x).value()));
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_wait_time).update();

  - platform: template
    id: ${cc1101id}_hyst_level
    name: "${cc1101name} AGC hysteresis level"
    options:
      - "None"
      - "Low"
      - "Medium"
      - "High"
    lambda: |-
      return id(${cc1101id}_hyst_level).at(id(${cc1101id}_state).HYST_LEVEL);
    set_action:
      then:
        - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_hyst_level(static_cast<esphome::cc1101::HystLevel>(id(${cc1101id}_hyst_level).index_of(x).value()));
        - script.execute: read_all_${cc1101id}_registers
        - lambda: id(${cc1101id}_hyst_level).update();

switch:
  - platform: template
    id: ${cc1101id}_packet_mode
    name: "${cc1101name} Packet mode"
    lambda: return id(${cc1101id}_state).PKT_FORMAT == static_cast<uint8_t>(esphome::cc1101::PacketFormat::PACKET_FORMAT_FIFO);
    turn_on_action:
      - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_packet_mode(true);
      - script.execute: read_all_${cc1101id}_registers
      - lambda: id(${cc1101id}_packet_mode).publish_state(true);
    turn_off_action:
      - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_packet_mode(false);
      - script.execute: read_all_${cc1101id}_registers
      - lambda: id(${cc1101id}_packet_mode).publish_state(false);

  - platform: template
    id: ${cc1101id}_crc_enable
    name: "${cc1101name} CRC enable"
    lambda: return static_cast<bool>(id(${cc1101id}_state).CRC_EN);
    turn_on_action:
      - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_crc_enable(true);
      - script.execute: read_all_${cc1101id}_registers
      - lambda: id(${cc1101id}_crc_enable).publish_state(true);
    turn_off_action:
      - lambda: if (${cc1101id}->is_ready()) id($cc1101id).set_crc_enable(false);
      - script.execute: read_all_${cc1101id}_registers
      - lambda: id(${cc1101id}_crc_enable).publish_state(false);

  - platform: template
    id: ${cc1101id}_whitening
    name: "${cc1101name} Whitening"
    lambda: return static_cast<bool>(id(${cc1101id}_state).WHITE_DATA);
